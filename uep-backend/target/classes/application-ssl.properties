# Profil optionnel pour démontrer un déploiement HTTPS en local.
# Jamais actif par défaut : lancer avec -Dspring-boot.run.profiles=ssl
# (voir documents/https-dev-setup.md pour générer le keystore requis).
server.port=${SERVER_SSL_PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE_PATH:classpath:keystore/edupro-uep-dev.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=edupro-uep
