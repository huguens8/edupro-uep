spring.application.name=edupro-uep

# Réglages locaux non versionnés (identifiants SMTP...) : copier
# application-local.properties.example en application-local.properties et le remplir.
# Ses valeurs remplacent celles de ce fichier.
# Lu directement dans src/main/resources (pas la copie de target/classes, qui peut être périmée),
# que le backend soit lancé depuis uep-backend/ ou depuis la racine du dépôt.
spring.config.import=optional:file:./src/main/resources/application-local.properties,optional:file:./uep-backend/src/main/resources/application-local.properties

# Toutes les valeurs sensibles ci-dessous sont surchargeables par variable
# d'environnement ; les valeurs après ":" sont des defauts de developpement
# uniquement, a ne jamais utiliser tels quels en production.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/GestionProjetUEP}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update

# Secret pour signer les JWT (Base64).
app.jwt.secret=${JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS1zZWNyZXQta2V5LTEyMzQ1Ng==}
# Duree de validite de l'access token en millisecondes (ici 15 minutes).
app.jwt.expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
# Duree de validite du refresh token en millisecondes (ici 7 jours).
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Compte ADM créé automatiquement au premier démarrage si aucun ADM n'existe.
# A changer immédiatement après la première connexion.
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@edupro-uep.local}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}

# Cookie du refresh token : a forcer a true en production (HTTPS uniquement).
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
# Verrouillage de compte apres N echecs consecutifs, pendant M minutes.
app.auth.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
app.auth.lockout-minutes=${AUTH_LOCKOUT_MINUTES:15}
# Limitation du nombre de tentatives de connexion par IP sur une fenetre glissante.
app.auth.rate-limit.max-attempts=${AUTH_RATE_LIMIT_MAX:10}
app.auth.rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}

# Envoi d'e-mails (identifiants des comptes créés par l'administrateur).
# Désactivé par défaut : le message est alors écrit dans les logs du serveur (développement).
# En production : APP_MAIL_ENABLED=true et les paramètres SMTP ci-dessous.
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:no-reply@edupro-uep.local}
# URL du frontend, citée dans l'e-mail pour se connecter.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Documents de projet et protocoles d'accord des PTF (UC-E1, UC-D1) : stockés sur disque,
# la base ne garde que le chemin relatif à ce dossier.
app.storage.dir=${APP_STORAGE_DIR:./uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
